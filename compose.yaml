# 로컬 개발 환경(dev). 클러스터(k8s/)는 시연·운영(prod)만 쓴다(docs/infrastructure.md, docs/development/local-environment.md).
# 시작: bash scripts/dev-up.sh  /  종료: bash scripts/dev-down.sh(DB 볼륨은 남김)
name: skala-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?로컬 .env에 POSTGRES_DB가 필요합니다}
      POSTGRES_USER: ${POSTGRES_USER:?로컬 .env에 POSTGRES_USER가 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?로컬 .env에 POSTGRES_PASSWORD가 필요합니다}
      # 한글 데이터(조직명·소명 등)를 그대로 저장한다
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:15432:5432"   # DBeaver 등 DB 도구 접속용
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # local 프로필: 체험 계정·조직 시드(db/local), 인증코드는 메일 대신 로그(docker compose logs backend | grep 인증코드)
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_STORAGE_LOCAL_ROOT: /data/storage
      SUBMISSION_TEMPLATE_LOCATION: file:/data/templates/submission-template.xlsb
      APP_SUBMISSION_TEMPLATE_FILENAME: 제출양식.xlsb
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_data:/data          # 업로드 원본·제출 양식(클러스터의 PVC와 같은 위치)
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python3", "-B", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health/readiness', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      # 챗봇·값 채우기 조회 DB. 로컬은 같은 PostgreSQL의 ai 스키마(클러스터와 같음). OpenAI 키는 .env의 OPENAI_API_KEY(선택)
      AI_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
