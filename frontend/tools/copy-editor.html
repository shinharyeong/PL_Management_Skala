<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화면 문구 편집</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui;background:#f3f5fa;color:#24354b;max-width:960px;margin:32px auto;padding:0 20px}header{position:sticky;top:0;background:#f3f5fa;padding:12px 0;border-bottom:1px solid #ced6e2;z-index:1}h1{font-size:24px}button,input,textarea{font:inherit}button{padding:10px 16px;border:1px solid #bac8db;border-radius:10px;background:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#315fd0;color:white}nav{display:flex;gap:10px;flex-wrap:wrap}input{width:100%;padding:10px;margin-top:12px;border:1px solid #bac8db;border-radius:8px}section{background:white;padding:20px;border-radius:14px;margin:20px 0}label{display:block;margin-bottom:18px}label span{display:block;font-size:13px;color:#56677d}textarea{width:100%;min-height:52px;padding:10px;border:1px solid #bac8db;border-radius:8px;resize:vertical}#status{color:#285d45;min-height:26px}.help{color:#56677d}strong{color:#254b9e}</style>
<header><h1>화면 문구 편집</h1><p class="help">메뉴·화면 제목·로그인 안내·월간 관리의 주요 버튼을 수정합니다.</p><nav><button id="open">문구 파일 열기</button><button id="save" class="primary" disabled>파일에 저장</button><button id="download">JSON 내려받기</button></nav><input id="search" type="search" placeholder="문구 검색"><p id="status" role="status"></p></header>
<p><strong>처음에는 frontend/src/prototype/ui-copy.json을 선택하세요.</strong><br>문구를 수정하고 저장하면 실행 중인 개발 화면에 반영됩니다. 왼쪽 항목 이름은 유지하고 입력칸의 내용만 바꿉니다.</p><main id="fields"></main>
<script type="module">
let copy, handle, dirty=false;
const fields=document.querySelector('#fields'), status=document.querySelector('#status');
const groups={pages:'메뉴 · 화면 제목',login:'로그인 · 로그아웃',monthly:'월간 시트 관리'};
const expected=await fetch('/src/prototype/ui-copy.json').then(r=>{if(!r.ok)throw Error('개발 서버에서 열어 주세요.');return r.json()});
function valid(value){return value&&Object.keys(expected).length===Object.keys(value).length&&Object.entries(expected).every(([group,items])=>value[group]&&Object.keys(items).length===Object.keys(value[group]).length&&Object.keys(items).every(key=>typeof value[group][key]==='string'))}
function render(){fields.replaceChildren();for(const [group,items] of Object.entries(copy)){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=groups[group]||group;section.append(title);for(const [key,text] of Object.entries(items)){const label=document.createElement('label'),caption=document.createElement('span'),input=document.createElement('textarea');caption.textContent=group+' / '+key;input.value=text;input.addEventListener('input',()=>{copy[group][key]=input.value;dirty=true;status.textContent='수정됨 · 파일에 저장해 주세요.'});label.append(caption,input);section.append(label)}fields.append(section)}filter()}
function filter(){const q=document.querySelector('#search').value.toLowerCase();for(const label of fields.querySelectorAll('label'))label.hidden=!((label.textContent+' '+label.querySelector('textarea').value).toLowerCase().includes(q))}
document.querySelector('#search').oninput=filter;
document.querySelector('#open').onclick=async()=>{try{if(dirty&&!confirm('저장하지 않은 수정을 버리고 파일을 열까요?'))return;const [selected]=await showOpenFilePicker({multiple:false,types:[{description:'화면 문구 JSON',accept:{'application/json':['.json']}}]});const value=JSON.parse(await(await selected.getFile()).text());if(!valid(value))throw Error('ui-copy.json 파일을 선택해 주세요.');handle=selected;copy=value;dirty=false;render();document.querySelector('#save').disabled=false;status.textContent='문구 파일을 열었습니다.'}catch(e){if(e.name!=='AbortError')status.textContent=e.message}};
document.querySelector('#save').onclick=async()=>{try{if(!handle||!valid(copy))throw Error('문구 파일을 다시 열어 주세요.');const stream=await handle.createWritable();await stream.write(JSON.stringify(copy,null,2)+'\n');await stream.close();dirty=false;status.textContent='저장했습니다. 서비스 화면에서 확인해 주세요.'}catch(e){status.textContent=e.message}};
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(copy,null,2)+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='ui-copy.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
copy=structuredClone(expected);render();
</script></html>
