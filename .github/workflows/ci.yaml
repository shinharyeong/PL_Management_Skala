# PR·develop·main마다 테스트 4종을 돌린다. 이미지 빌드(linux/amd64)는 그 이미지의 Dockerfile·의존성 파일이 바뀐 경우에만 한다.
# Harbor push는 하지 않는다: 플랫폼 안내상 GitHub Actions에서 Harbor push가 막혀 있고(2026-11-19),
# 클러스터 배포도 캠퍼스 네트워크에서만 된다. 배포는 scripts/deploy.sh로 한다(docs/infrastructure.md).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 이미지가 깨질 수 있는 파일(Dockerfile·의존성·빌드 설정)이 바뀌었는지 서비스별로 본다. 바뀐 이미지만 아래 images에서 빌드한다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      # 바뀐 파일은 GitHub API가 아니라 git으로 비교한다(API가 바쁠 때 "diff temporarily unavailable"로 실패한 적 있음).
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ""            # 빈 토큰이면 API 대신 git diff를 쓴다
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          filters: |
            backend:
              - backend/Dockerfile
              - backend/build.gradle.kts
              - backend/settings.gradle.kts
              - backend/gradle/**
              - .dockerignore
              - .github/workflows/ci.yaml
            ai:
              - ai/Dockerfile
              - ai/requirements.txt
              - .dockerignore
              - .github/workflows/ci.yaml
            frontend:
              - frontend/Dockerfile
              - frontend/package.json
              - frontend/package-lock.json
              - frontend/nginx.conf
              - .dockerignore
              - .github/workflows/ci.yaml

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: skala_test, POSTGRES_USER: ci, POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d skala_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: actions/setup-python@v5     # 백엔드가 파서를 자식 프로세스로 실행한다
        with: { python-version: "3.11" }
      - name: test
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/skala_test
          TEST_DB_USERNAME: ci
          TEST_DB_PASSWORD: ci
        run: ./gradlew --no-daemon test

  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: test
        working-directory: parser
        run: PYTHONPATH=src python -B -m unittest discover -s tests

  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: aitest, POSTGRES_USER: aitest, POSTGRES_PASSWORD: aitest }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aitest -d aitest" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ai/requirements.txt }
      - run: pip install -r ai/requirements.txt
      - name: test
        working-directory: ai
        env:
          AI_TEST_DATABASE_URL: postgresql://aitest:aitest@127.0.0.1:5432/aitest
        run: python -B -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run test:prototype && npm run build

  images:
    needs: [changes, backend, parser, ai, frontend]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.service }} (push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
