spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skala}
    username: ${DB_USERNAME:skala}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # 쿠버네티스 프로브용 /actuator/health/readiness·liveness
      probes:
        enabled: true
  metrics:
    tags:
      application: backend
    distribution:
      # Grafana에서 API 응답 시간 p95를 계산하려면 히스토그램 버킷이 필요하다
      percentiles-histogram:
        http.server.requests: true

app:
  # 제출 양식(연간·월간 공통). 엑셀은 저장소에 커밋하지 않으므로 배포 환경에 파일을 둔다.
  submission-template:
    location: ${SUBMISSION_TEMPLATE_LOCATION:file:./templates/submission-template.xlsx}
    filename: 제출양식.xlsx
  # 보고서 AI(report-ai, 클러스터 내부). 명세 12절. token은 양쪽이 같은 REPORT_AI_TOKEN(헤더 X-Internal-Token)
  report-ai:
    base-url: ${REPORT_AI_URL:http://localhost:8000}
    token: ${REPORT_AI_TOKEN:}
    timeout-seconds: ${REPORT_AI_TIMEOUT_SECONDS:90}
    # true면 token이 비어 있을 때 내부 보고를 거부하고 report-ai도 부르지 않는다(운영 프로필에서 켬). false는 로컬 개발용
    require-token: ${REPORT_AI_REQUIRE_TOKEN:false}
  # 기한 경과 알림 확인 주기(KST cron). "-"이면 끈다.
  notification:
    overdue-scan:
      cron: ${NOTIFICATION_OVERDUE_SCAN_CRON:0 */5 * * * *}
