# 클러스터 배포용(SPRING_PROFILES_ACTIVE=prod). DB 접속 값은 플랫폼 Secret rds-credentials의
# SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수가 채운다. 메일은 SPRING_MAIL_* 가 있으면 SMTP로 보낸다.
spring:
  datasource:
    hikari:
      # 팀 계정 동시 연결 50개 제한(인스턴스 공용)
      maximum-pool-size: 5
      minimum-idle: 1

server:
  # Ingress(HTTPS) 뒤에서 원래 프로토콜·주소를 쓴다.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    # actuator(health·prometheus)를 8081로 분리한다. frontend nginx가 /actuator를 8080으로 넘기므로
    # 같은 포트면 지표가 Ingress로 외부에 노출된다. 8081은 클러스터 안(프로브·Prometheus)에서만 쓴다.
    port: 8081

app:
  # 운영에서는 report-ai 내부 토큰이 없으면 거부한다(공용 클러스터라 다른 네임스페이스에서도 서비스에 닿을 수 있음).
  report-ai:
    require-token: true
  storage:
    # PVC(/data)에 둔다. S3 연결 전까지 파드가 바뀌어도 원본이 남도록
    local-root: /data/storage
  submission-template:
    location: ${SUBMISSION_TEMPLATE_LOCATION:file:/data/templates/submission-template.xlsx}
