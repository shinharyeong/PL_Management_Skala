  /report/explanations:
    get:
      operationId: listReportExplanations
      tags:
      - AI 보고서
      summary: RPT-13 Gap 설명 블록용 승인 소명 카드 + 제안 분류
      description: |-
        블록 = 기준 월(year, month) × 비교 종류. 그 달 version(확정 master, 없으면 조직별 최신 승인본 — 보고서용 뷰와 같은 규칙)의 제출본에서 임계값을 넘은 검토 항목이다. 실적 비교(ACTUAL_VS_PLAN)는 기준 월 항목, 추정 비교는 기준 월+1 항목(12월 기준 추정은 없음).
        금액은 소명이 달린 검토 항목의 Gap 금액(gap_comparison). 수락된 소명만 카드(items), 수락 전은 reviewing.
        후보: 지난달 같은 조직·항목 분류(LAST_MONTH) 우선, 없으면 답변에 유형 단어가 하나만 맞을 때(RULE).
        분류하지 않은 카드는 '기타'(catchAll) 합계에 들어가고, 상위 유형 합계는 하위 합. gapTotal은 수락 전 소명까지 포함해 classifiedTotal과 비교한다.
      x-fr:
      - FR-RPT-007
      x-tables:
      - review_explanation
      - explanation_classification
      - gap_comparison
      parameters:
      - $ref: '#/components/parameters/Year'
      - $ref: '#/components/parameters/Month'
        required: true
      - name: comparison
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Comparison'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gapTotal:
                    $ref: '#/components/schemas/Money'
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        explanationId:
                          $ref: '#/components/schemas/Id'
                        organization:
                          $ref: '#/components/schemas/OrganizationRef'
                        item:
                          type: string
                        gapAmount:
                          $ref: '#/components/schemas/Money'
                        answer:
                          type: string
                        categoryId:
                          oneOf:
                          - $ref: '#/components/schemas/Id'
                          - type: 'null'
                          description: 이미 분류했으면 값
                        suggestedCategoryId:
                          oneOf:
                          - $ref: '#/components/schemas/Id'
                          - type: 'null'
                        suggestionSource:
                          type:
                          - string
                          - 'null'
                          enum:
                          - RULE
                          - LAST_MONTH
                          - null
                  categoryTotals:
                    type: object
                    description: 유형 id → 합계(원). 미분류는 '기타', 상위 유형은 하위 합
                    additionalProperties:
                      $ref: '#/components/schemas/Money'
                  classifiedTotal:
                    $ref: '#/components/schemas/Money'
                  matchesGapTotal:
                    type: boolean
                  reviewing:
                    type: array
                    description: 아직 승인 전이라 분류할 수 없는 소명
                    items:
                      type: object
                      properties:
                        organization:
                          $ref: '#/components/schemas/OrganizationRef'
                        item:
                          type: string
                        gapAmount:
                          $ref: '#/components/schemas/Money'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
