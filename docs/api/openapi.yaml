    post:
      operationId: actOnReviewItems
      tags:
      - Gap 검토
      summary: GAP-07 선택 항목 처리(제외 / 선택 항목 검토하기 / 소명 요청)
      description: '- `EXCLUDE`: 검토 필요 → 제외됨(사유 기록)

        - `SELECT`: 검토 필요 → 검토 완료(사업부 하위 메뉴 생성)

        - `REQUEST_EXPLANATION`: 일괄 소명 요청(회신 기한·메시지 필수). 셀 단위 버전 비교에서 고른 셀도 이 명령으로 요청

        같은 제출 요청의 PENDING 제출본 항목만 함께 처리할 수 있음.

        '
      x-fr:
      - FR-MONTH-007
      - FR-MONTH-009
      - FR-MONTH-010
      - FR-MONTH-012
      x-tables:
      - review_item
      - review_workflow_event
      - review_explanation
      - notification
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - items
              properties:
                action:
                  type: string
                  enum:
                  - EXCLUDE
                  - SELECT
                  - REQUEST_EXPLANATION
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required:
                    - reviewItemId
                    - expectedStateToken
                    properties:
                      reviewItemId:
                        $ref: '#/components/schemas/Id'
                      expectedStateToken:
                        $ref: '#/components/schemas/StateToken'
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 4000
                  description: 제외 사유
                dueAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: REQUEST_EXPLANATION 필수
                message:
                  type:
                  - string
                  - 'null'
                  maxLength: 5000
                  description: REQUEST_EXPLANATION 필수
            example:
              action: REQUEST_EXPLANATION
              items:
              - reviewItemId: '880'
                expectedStateToken: st_9
              dueAt: '2026-11-12T09:00:00Z'
              message: ① 차이 원인 ② 향후 대응 ③ 영향 기간을 작성해 주세요.
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        reviewItemId:
                          $ref: '#/components/schemas/Id'
                        tab:
                          $ref: '#/components/schemas/WorkflowTab'
                        stateToken:
                          $ref: '#/components/schemas/StateToken'
                  tabCounts:
                    type: object
                    additionalProperties:
                      type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REVIEW_LOCKED` 검토 대기 제출본이 아님, `REVIEW_STAGE_CONFLICT` 검토 필요 상태가 아닌 항목 선정, `REVIEW_EXCLUDED` 이미 제외됨 + 명령 공통 409'
