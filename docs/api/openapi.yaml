openapi: 3.1.0
info:
  title: 경영팀을 부탁해 API
  version: 0.1.0-draft
  description: '손익 제출·Gap 소명·버전 관리·AI 보고서 플랫폼의 브라우저용 공개 API 명세(초안)입니다.


    - 기준: PRD ver1 기능 요구사항(유효 77개), 물리 ERD 설계안 `docs/erd/physical-erd.dbml`, 인프라 구성 `docs/infrastructure.md`

    - 개요·FR 대응·정할 것은 `docs/api/api-spec.md`를 함께 봅니다.

    - 각 operation의 `x-fr`는 대응 기능 요구사항, `x-tables`는 관련 테이블입니다.


    **공통 규칙**

    - 금액은 원 단위 십진수 문자열, 값이 없으면 `null`(0으로 바꾸지 않음). 기준값이 0이면 비율은 `null`.

    - 상태 변경 명령(POST·PUT·PATCH·DELETE)은 `Idempotency-Key` 헤더가 필수이고, 기존 리소스를 바꾸는 명령은 본문에 `expectedStateToken`을 넣습니다. 의사결정 에이전트는 분석/요청의 `expectedRevision`과 분석 변경을 동반할 때 `expectedAnalysisRevision`을 사용합니다.

    - 오류는 RFC 9457 Problem Details(`application/problem+json`)에 `code`·`requestId`·`errors`를 더해 내려줍니다. 화면 분기는 `code`로 합니다.

    - 파일 업로드는 `multipart/form-data`로 backend에 보내고, backend가 형식·크기·조직을 검사한 뒤 현재는 로컬 디스크/PVC에 저장합니다. 다운로드는 backend가 권한을 확인하고 파일을 읽어 전달합니다. S3·RabbitMQ 전환과 초안 수명 주기 정리는 2차 목표입니다.

    - 모든 응답에 `X-Request-ID`, `Cache-Control: private, no-store` 헤더가 붙습니다.

    '
servers:
- url: /api/v1
  description: Ingress `/api/*` → backend
security:
- bearerAuth: []
tags:
- name: 로그인·사용자
  description: FR-AUTH, FR-MENU
- name: 알림 모아보기
  description: FR-NOTI-A (경영기획팀)
- name: 홈·전사 손익
  description: FR-HOME (경영기획팀)
- name: 제출 요청
  description: FR-YEAR, FR-MONTH-001~003 (경영기획팀)
- name: Gap 검토
  description: FR-MONTH-004~012 (경영기획팀)
- name: 조직별 현황
  description: FR-ARCH (경영기획팀)
- name: 요청함
  description: FR-NOTI-U (조직 담당자)
- name: 업로드·검증
  description: FR-UPLOAD (조직 담당자)
- name: 소명·제출
  description: FR-PROOF, FR-RESUB (조직 담당자)
- name: 제출 이력
  description: FR-HIST, FR-RESUB-001 (조직 담당자)
- name: AI 보고서
  description: FR-RPT (경영기획팀)
- name: 경영 의사결정 에이전트
  description: 확정 기준·목표·근거 조회·개선 가설·조직 검토·의사결정서·후속 전망 비교
- name: 파일
  description: 서버 경유 업로드·다운로드(현재 로컬/PVC 저장)
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 클러스터 내부 API 전용. 브라우저에 제공하지 않는다.
    decisionToolToken:
      type: apiKey
      in: header
      name: X-Decision-Tool-Token
      description: 분석 ID·revision·허용 참조에 한정된 3분 내부 읽기 권한
    bearerAuth:
      type: http
      scheme: bearer
      description: AUTH-02(`POST /auth/sessions`)에서 받은 세션 토큰
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 명령 재전송 시 첫 성공 응답을 그대로 돌려받기 위한 키(24시간 보관). 같은 키에 다른 본문이면 `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 클라이언트 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려줌
      schema:
        type: string
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `nextCursor`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Unit:
      name: unit
      in: query
      description: 화면 표시 단위. 지정하면 금액 필드 옆에 `displayAmount`를 함께 내려줌(원 단위 값은 항상 유지)
      schema:
        type: string
        enum:
        - WON
        - THOUSAND
        - MILLION
        - HUNDRED_MILLION
        default: WON
    Year:
      name: year
      in: query
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
      example: 2026
    YearOptional:
      name: year
      in: query
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
    Month:
      name: month
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 12
      example: 10
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReviewItemId:
      name: reviewItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MasterId:
      name: masterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    HomeQueryPeriod:
      name: period
      in: query
      description: 월간/연간 탭 (FR-HOME-004)
      schema:
        type: string
        enum:
        - MONTH
        - YEAR
        default: MONTH
    HomeQueryMaster:
      name: masterId
      in: query
      description: 이전 master를 볼 때 지정. 없으면 그 달 최신 master(없으면 잠정 계산)
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    XRequestId:
      description: 요청 추적 ID
      schema:
        type: string
    CacheControl:
      description: 항상 `private, no-store`
      schema:
        type: string
        example: private, no-store
    Location:
      description: 만든 리소스 또는 상태 조회 경로
      schema:
        type: string
    IdempotencyReplayed:
      description: 같은 `Idempotency-Key` 재전송으로 첫 응답을 돌려준 경우 `true`
      schema:
        type: string
        enum:
        - 'true'
    RetryAfter:
      description: 재시도까지 기다릴 초
      schema:
        type: integer
  responses:
    NoContent:
      description: 처리 완료(본문 없음)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
    FileStream:
      description: 파일 스트림. backend가 로컬/PVC에서 읽거나 DB 숫자로 생성해 전달
      headers:
        Content-Disposition:
          description: '`attachment; filename*=UTF-8''''...`'
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
    BadRequest:
      description: '`INVALID_REQUEST` 필수 값·형식·범위 오류, `INVALID_CURSOR` 잘못된 커서'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: 요청 형식과 입력값을 확인해 주세요.
            instance: /api/v1/submission-requests
            code: INVALID_REQUEST
            requestId: 8f3c2a1e-4b7d-4c1a-9a0e-2f6d1c3b5a77
            errors:
            - field: dueAt
              code: INVALID_VALUE
    Unauthorized:
      description: '`UNAUTHENTICATED` 토큰 없음·만료 → 로그인 화면으로'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: 인증이 필요합니다.
            instance: /api/v1/me
            code: UNAUTHENTICATED
            requestId: 8f3c2a1e
            errors: []
    Forbidden:
      description: '`FORBIDDEN` 역할이 맞지 않거나 다른 조직의 데이터'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: 현재 권한으로 접근할 수 없습니다.
            instance: /api/v1/submissions/12
            code: FORBIDDEN
            requestId: 8f3c2a1e
            errors: []
    NotFound:
      description: '`RESOURCE_NOT_FOUND`(또는 `SUBMISSION_NOT_FOUND`, `REVIEW_ITEM_NOT_FOUND` 등) 리소스 없음'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 요청한 자료를 찾을 수 없습니다.
            instance: /api/v1/submissions/999
            code: RESOURCE_NOT_FOUND
            requestId: 8f3c2a1e
            errors: []
    CommandConflict:
      description: '명령 공통 409 — `RESOURCE_CHANGED`(상태 토큰 불일치, 다시 조회 후 재시도),

        `IDEMPOTENCY_KEY_REUSED`(같은 키에 다른 본문), `REQUEST_IN_PROGRESS`(같은 키 처리 중, `Retry-After: 1`)

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: 다른 사용자가 먼저 변경했습니다. 다시 조회해 주세요.
            instance: /api/v1/submissions/12/submit
            code: RESOURCE_CHANGED
            requestId: 8f3c2a1e
            errors: []
    TooLarge:
      description: '`FILE_TOO_LARGE` 업로드 한도 초과'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: '`INTERNAL_ERROR` 예상하지 못한 오류(화면에 requestId 표시), `PROCESSING_UNAVAILABLE`(503) 처리 서비스 일시 불가'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: 요청 처리 중 오류가 발생했습니다.
            instance: /api/v1/home/pnl
            code: INTERNAL_ERROR
            requestId: 8f3c2a1e
            errors: []
    UnsupportedFile:
      description: '`UNSUPPORTED_FILE_TYPE` 허용하지 않는 확장자·형식'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: DB ID(bigint)를 문자열로 표기
      example: '12'
    Money:
      type:
      - string
      - 'null'
      pattern: ^-?[0-9]{1,24}(\.[0-9]{1,6})?$
      description: 원 단위 십진수 문자열. 값이 없거나 계산할 수 없으면 null
      example: '1240000000'
    Rate:
      type:
      - string
      - 'null'
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      description: 비율(%). 기준값이 0이면 null(화면 표시 '산정 불가')
      example: '14.8'
    Timestamp:
      type: string
      format: date-time
      example: '2026-11-12T09:00:00Z'
    StateToken:
      type: string
      description: 리소스의 현재 상태 지문. 수정 명령의 `expectedStateToken`에 그대로 넣음
      example: st_3f9a1c
    Label:
      type: string
      description: 화면 표시용 버전 이름(`2026-11-01`, `ver10.01`, `2027-PLAN-01`, `master_ver10.01`, `master_plan2027.01`)
      example: '2026-11-01'
    Scenario:
      type: string
      enum:
      - PLAN
      - ACTUAL
      - ESTIMATE
      description: 계획 / 실적 / 추정
    Comparison:
      type: string
      enum:
      - ACTUAL_VS_PLAN
      - ESTIMATE_VS_PREVIOUS
      - ESTIMATE_VS_PLAN
      description: 실적 vs 계획 / 추정 vs 직전 추정 / 추정 vs 계획 (FR-MONTH-005)
    RequestType:
      type: string
      enum:
      - ANNUAL_PLAN
      - MONTHLY_ACTUAL
      description: 연간 계획 요청 / 월간 시트(실적·추정) 요청
    SubmissionStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - REJECTED
      - APPROVED
      description: 업로드만 함 / 검토 대기 / 재제출 요청됨 / 승인
    WorkflowTab:
      type: string
      enum:
      - NEEDS_REVIEW
      - SELECTED
      - IN_PROGRESS
      - RE_REVIEW
      - ACCEPTED
      - EXCLUDED
      - ALL
      description: Gap 상태 탭 (FR-MONTH-006). IN_PROGRESS·RE_REVIEW·ACCEPTED는 소명 회차로 계산
    DataStatus:
      type: string
      enum:
      - CONFIRMED
      - PROVISIONAL
      - NONE
      description: master 있음 / master 없이 승인본만으로 계산한 잠정 / 데이터 없음
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - requestId
      - errors
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          description: 화면에 보여 줄 수 있는 한국어 설명
        instance:
          type: string
          description: 오류가 난 요청 경로(쿼리 제외)
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: 프론트 분기용 오류 코드
        requestId:
          type: string
        errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
          example: dueAt
        code:
          type: string
          example: INVALID_VALUE
    PageInfo:
      type: object
      required:
      - nextCursor
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: 마지막 페이지면 null
    StateTokenInput:
      type: object
      required:
      - expectedStateToken
      properties:
        expectedStateToken:
          $ref: '#/components/schemas/StateToken'
    OrganizationRef:
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          example: D100
        name:
          type: string
          example: 네트워크인프라부문
    UserRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 최인프 매니저
    Organization:
      allOf:
      - $ref: '#/components/schemas/OrganizationRef'
      - type: object
        properties:
          managers:
            type: array
            description: 수신 담당자(조직 담당자 계정)
            items:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                name:
                  type: string
                email:
                  type: string
                  format: email
    Me:
      type: object
      required:
      - user
      - role
      - menus
      properties:
        user:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
              example: 김기획 매니저
            email:
              type: string
              format: email
        role:
          type: string
          enum:
          - PLANNER
          - ORG_MANAGER
        organization:
          description: 조직 담당자만. 경영기획팀은 null
          oneOf:
          - $ref: '#/components/schemas/OrganizationRef'
          - type: 'null'
        homePath:
          type: string
          example: /planning
        menus:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: NOTIFICATIONS
              label:
                type: string
                example: 알림 모아보기
              path:
                type: string
    Link:
      type: object
      description: 이동할 화면과 미리 선택할 대상
      properties:
        path:
          type: string
          example: /planning/gap
        query:
          type: object
          additionalProperties:
            type: string
          example:
            requestId: '31'
            organizationId: '4'
            reviewItemId: '880'
    Notification:
      type: object
      required:
      - id
      - type
      - title
      - organization
      - occurredAt
      - read
      - link
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum:
          - SUBMISSION
          - REPLY
          - OVERDUE
        title:
          type: string
          example: 10월 매출 Gap 소명 회신 도착
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        actor:
          description: 회신자(기한 경과는 null)
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        read:
          type: boolean
        link:
          $ref: '#/components/schemas/Link'
    SubmissionRequest:
      type: object
      required:
      - id
      - type
      - year
      - status
      - dueAt
      - requestedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/RequestType'
        year:
          type: integer
          example: 2026
        month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 12
          description: 연간 요청은 null
        title:
          type: string
          example: 2026년 10월 월간 시트
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        message:
          type: string
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        requestedBy:
          $ref: '#/components/schemas/UserRef'
        submittedCount:
          type: integer
        targetCount:
          type: integer
        stateToken:
          $ref: '#/components/schemas/StateToken'
    RequestTarget:
      type: object
      required:
      - organization
      - displayStatus
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        selected:
          type: boolean
          description: 실제로 요청을 보낸 조직인지(false면 필수 대상이지만 아직 요청 안 함)
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        displayStatus:
          type: string
          enum:
          - SUBMITTED
          - OVERDUE
          - WAITING
          description: 제출 완료 / 기한 경과 / 회신 대기 (FR-YEAR-002, FR-MONTH-002). 최신 제출본 상태와 기한으로 계산
        latestSubmission:
          oneOf:
          - $ref: '#/components/schemas/SubmissionSummary'
          - type: 'null'
    SubmissionSummary:
      type: object
      required:
      - id
      - status
      - label
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        displayStatus:
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - RESUBMIT_REQUESTED
          - SUPERSEDED
          description: 화면 상태. 반려됐고 새 제출본이 없으면 RESUBMIT_REQUESTED(재제출 요청), 새 제출본으로 대체됐으면 SUPERSEDED(반려된 제출본)
        label:
          $ref: '#/components/schemas/Label'
        approvedLabel:
          type:
          - string
          - 'null'
          description: 승인 버전(`ver10.01`). APPROVED일 때만
        requestId:
          $ref: '#/components/schemas/Id'
        requestTitle:
          type: string
        period:
          type: string
          example: '2026.11'
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        stateToken:
          $ref: '#/components/schemas/StateToken'
    FileRef:
      type: object
      properties:
        name:
          type: string
          example: D100_2026-11.xlsx
        url:
          type: string
          description: 다운로드 API 경로
    Submission:
      allOf:
      - $ref: '#/components/schemas/SubmissionSummary'
      - type: object
        properties:
          kind:
            $ref: '#/components/schemas/RequestType'
          title:
            type: string
            example: 2026년 11월 월간 실적·추정 제출
          organization:
