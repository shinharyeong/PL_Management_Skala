            - string
            - 'null'
            description: 조직 담당자 회신 메시지
          reviewComment:
            type:
            - string
            - 'null'
            description: 경영기획팀 코멘트(재제출 요청 시 필수)
          submittedBy:
            $ref: '#/components/schemas/UserRef'
          reviewedBy:
            oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          reviewedAt:
            type:
            - string
            - 'null'
            format: date-time
          parsingJob:
            $ref: '#/components/schemas/ParsingJob'
          validation:
