      description: 응답 합계는 그 소명이 속한 블록 기준. comparison을 생략하면 그 항목이 넘은 첫 비교(ACTUAL_VS_PLAN → ESTIMATE_VS_PREVIOUS → ESTIMATE_VS_PLAN). 상위 유형에는 넣을 수 없다(400 CATEGORY_NOT_ASSIGNABLE).
