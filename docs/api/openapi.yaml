  /decision-agent/analyses/{id}/runs:
    $ref: './decision-agent.yaml#/paths/~1decision-agent~1analyses~1{id}~1runs'
  /annual-masters:
    get:
      operationId: listAnnualMasters
      tags: [조직별 현황]
      summary: 연간 계획 master 버전 목록 (경영기획팀 전용)
      description: 선택 연도의 확정 연간 master를 최신 버전부터 반환한다. 확정 전에는 WAITING, 연간 요청이 없으면 NO_REQUEST다.
      parameters:
      - in: query
        name: year
        schema: {type: integer, minimum: 2000, maximum: 9999}
        description: 생략하면 한국 시간 올해
      responses:
        '200':
          description: 연간 master 목록
          content:
            application/json:
              schema:
                type: object
                required: [year, state, items]
                properties:
                  year: {type: integer}
                  state: {type: string, enum: [CONFIRMED, WAITING, NO_REQUEST]}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, year, seq, label, createdAt, createdByName, organizationCount]
                      properties:
                        id: {type: string}
                        year: {type: integer}
                        seq: {type: integer}
                        label: {type: string, example: master_plan2026.01}
                        createdAt: {type: string, format: date-time}
                        createdByName: {type: string}
                        organizationCount: {type: integer}
        '400': {description: 연도 범위 오류}
        '401': {description: 로그인 필요}
        '403': {description: 경영기획팀 전용}
  /annual-masters/{masterId}/file:
    get:
      operationId: downloadAnnualMaster
      tags: [조직별 현황]
      summary: 연간 계획 master 엑셀 다운로드 (경영기획팀 전용)
      description: 해당 버전의 고정된 승인본에서 요청 연도 PLAN만 집계한다. 손익·출처 시트를 포함하며 15자리를 넘거나 소수가 있는 금액은 정확한 문자열로 기록한다.
      parameters:
      - in: path
        name: masterId
        required: true
        schema: {type: integer, format: int64}
      responses:
        '200':
          description: 연간 계획 master XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {description: 로그인 필요}
        '403': {description: 경영기획팀 전용}
        '404': {description: 연간 master 없음}
  /auth/codes:
    post:
      operationId: requestAuthCode
      tags:
      - 로그인·사용자
      summary: AUTH-01 인증 메일 요청·재전송
      description: 등록된 사내 도메인·계정에만 6자리 인증코드를 보냄. 코드 유효시간 3분, 재전송은 1분 후 가능. 로그인 전이라 사용자를 알 수 없어 Idempotency-Key를 받지 않는다(재전송 대기 1분으로 중복 발송을 막음).
      x-fr:
      - FR-AUTH-001
      - FR-AUTH-002
      x-tables:
      - app_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
            example:
              email: kim.plan@sk.com
      responses:
        '202':
          description: 인증 메일 발송
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  expiresAt:
                    $ref: '#/components/schemas/Timestamp'
                  resendAvailableAt:
                    $ref: '#/components/schemas/Timestamp'
              example:
                email: kim.plan@sk.com
                expiresAt: '2026-11-12T09:03:00Z'
                resendAvailableAt: '2026-11-12T09:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: '`UNREGISTERED_EMAIL` 등록되지 않은 계정·도메인 → ''등록되지 않은 계정입니다. 메일 주소를 확인해주세요'''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: '`CODE_RESEND_WAIT` 재전송 대기 시간(1분) 전'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
