          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '5'
        amountEnabled:
          type: boolean
        amount:
          type: string
          pattern: ^[0-9]+$
          description: 원 단위
          example: '50000000'
    ReviewTreeNode:
      type: object
