openapi: 3.1.0
info:
  title: 경영팀을 부탁해 API
  version: 0.1.0-draft
  description: '손익 제출·Gap 소명·버전 관리·AI 보고서 플랫폼의 브라우저용 공개 API 명세(초안)입니다.


    - 기준: PRD ver1 기능 요구사항(유효 77개), 물리 ERD 설계안 `docs/erd/physical-erd.dbml`, 인프라 구성 `docs/infrastructure.md`

    - 개요·FR 대응·정할 것은 `docs/api/api-spec.md`를 함께 봅니다.

    - 각 operation의 `x-fr`는 대응 기능 요구사항, `x-tables`는 관련 테이블입니다.


    **공통 규칙**

    - 금액은 원 단위 십진수 문자열, 값이 없으면 `null`(0으로 바꾸지 않음). 기준값이 0이면 비율은 `null`.

    - 상태 변경 명령(POST·PUT·PATCH·DELETE)은 `Idempotency-Key` 헤더가 필수이고, 기존 리소스를 바꾸는 명령은 본문에 `expectedStateToken`을 넣습니다.

    - 오류는 RFC 9457 Problem Details(`application/problem+json`)에 `code`·`requestId`·`errors`를 더해 내려줍니다. 화면 분기는 `code`로 합니다.

    - 파일 업로드는 `multipart/form-data`로 backend에 보내고, backend가 형식·크기·조직을 검사한 뒤 S3에 저장합니다. 다운로드는 backend가 권한을 확인하고 S3에서 읽어 그대로 내려줍니다(presigned URL 미사용).

    - 모든 응답에 `X-Request-ID`, `Cache-Control: private, no-store` 헤더가 붙습니다.

    '
servers:
- url: /api/v1
  description: Ingress `/api/*` → backend
security:
- bearerAuth: []
tags:
- name: 로그인·사용자
  description: FR-AUTH, FR-MENU
- name: 알림 모아보기
  description: FR-NOTI-A (경영기획팀)
- name: 홈·전사 손익
  description: FR-HOME (경영기획팀)
- name: 제출 요청
  description: FR-YEAR, FR-MONTH-001~003 (경영기획팀)
- name: Gap 검토
  description: FR-MONTH-004~012 (경영기획팀)
- name: 조직별 현황
  description: FR-ARCH (경영기획팀)
- name: 요청함
  description: FR-NOTI-U (조직 담당자)
- name: 업로드·검증
  description: FR-UPLOAD (조직 담당자)
- name: 소명·제출
  description: FR-PROOF, FR-RESUB (조직 담당자)
- name: 제출 이력
  description: FR-HIST, FR-RESUB-001 (조직 담당자)
- name: AI 보고서
  description: FR-RPT (경영기획팀)
- name: 파일
  description: 서버 경유 업로드·다운로드(S3 저장)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: AUTH-02(`POST /auth/sessions`)에서 받은 세션 토큰
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 명령 재전송 시 첫 성공 응답을 그대로 돌려받기 위한 키(24시간 보관). 같은 키에 다른 본문이면 `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 클라이언트 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려줌
      schema:
        type: string
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `nextCursor`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Unit:
      name: unit
      in: query
      description: 화면 표시 단위. 지정하면 금액 필드 옆에 `displayAmount`를 함께 내려줌(원 단위 값은 항상 유지)
      schema:
        type: string
        enum:
        - WON
        - THOUSAND
        - MILLION
        - HUNDRED_MILLION
        default: WON
    Year:
      name: year
      in: query
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
      example: 2026
    YearOptional:
      name: year
      in: query
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
    Month:
      name: month
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 12
      example: 10
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReviewItemId:
      name: reviewItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MasterId:
      name: masterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    HomeQueryPeriod:
      name: period
      in: query
      description: 월간/연간 탭 (FR-HOME-004)
      schema:
        type: string
        enum:
        - MONTH
        - YEAR
        default: MONTH
    HomeQueryMaster:
      name: masterId
      in: query
      description: 이전 master를 볼 때 지정. 없으면 그 달 최신 master(없으면 잠정 계산)
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    XRequestId:
      description: 요청 추적 ID
      schema:
        type: string
    CacheControl:
      description: 항상 `private, no-store`
      schema:
        type: string
        example: private, no-store
    Location:
      description: 만든 리소스 또는 상태 조회 경로
      schema:
        type: string
    IdempotencyReplayed:
      description: 같은 `Idempotency-Key` 재전송으로 첫 응답을 돌려준 경우 `true`
      schema:
        type: string
        enum:
        - 'true'
    RetryAfter:
      description: 재시도까지 기다릴 초
      schema:
        type: integer
  responses:
    NoContent:
      description: 처리 완료(본문 없음)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
    FileStream:
      description: 파일 스트림. backend가 S3(또는 DB 숫자로 생성)에서 읽어 그대로 전달
      headers:
        Content-Disposition:
          description: '`attachment; filename*=UTF-8''''...`'
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
    BadRequest:
      description: '`INVALID_REQUEST` 필수 값·형식·범위 오류, `INVALID_CURSOR` 잘못된 커서'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: 요청 형식과 입력값을 확인해 주세요.
            instance: /api/v1/submission-requests
            code: INVALID_REQUEST
            requestId: 8f3c2a1e-4b7d-4c1a-9a0e-2f6d1c3b5a77
            errors:
            - field: dueAt
              code: INVALID_VALUE
    Unauthorized:
      description: '`UNAUTHENTICATED` 토큰 없음·만료 → 로그인 화면으로'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: 인증이 필요합니다.
            instance: /api/v1/me
            code: UNAUTHENTICATED
            requestId: 8f3c2a1e
            errors: []
    Forbidden:
      description: '`FORBIDDEN` 역할이 맞지 않거나 다른 조직의 데이터'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: 현재 권한으로 접근할 수 없습니다.
            instance: /api/v1/submissions/12
            code: FORBIDDEN
            requestId: 8f3c2a1e
            errors: []
    NotFound:
      description: '`RESOURCE_NOT_FOUND`(또는 `SUBMISSION_NOT_FOUND`, `REVIEW_ITEM_NOT_FOUND` 등) 리소스 없음'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 요청한 자료를 찾을 수 없습니다.
            instance: /api/v1/submissions/999
            code: RESOURCE_NOT_FOUND
            requestId: 8f3c2a1e
            errors: []
    CommandConflict:
      description: '명령 공통 409 — `RESOURCE_CHANGED`(상태 토큰 불일치, 다시 조회 후 재시도),

        `IDEMPOTENCY_KEY_REUSED`(같은 키에 다른 본문), `REQUEST_IN_PROGRESS`(같은 키 처리 중, `Retry-After: 1`)

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: 다른 사용자가 먼저 변경했습니다. 다시 조회해 주세요.
            instance: /api/v1/submissions/12/submit
            code: RESOURCE_CHANGED
            requestId: 8f3c2a1e
            errors: []
    TooLarge:
      description: '`FILE_TOO_LARGE` 업로드 한도 초과'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: '`INTERNAL_ERROR` 예상하지 못한 오류(화면에 requestId 표시), `PROCESSING_UNAVAILABLE`(503) 처리 서비스 일시 불가'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: 요청 처리 중 오류가 발생했습니다.
            instance: /api/v1/home/pnl
            code: INTERNAL_ERROR
            requestId: 8f3c2a1e
            errors: []
    UnsupportedFile:
      description: '`UNSUPPORTED_FILE_TYPE` 허용하지 않는 확장자·형식'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: DB ID(bigint)를 문자열로 표기
      example: '12'
    Money:
      type:
      - string
      - 'null'
      pattern: ^-?[0-9]{1,24}(\.[0-9]{1,6})?$
      description: 원 단위 십진수 문자열. 값이 없거나 계산할 수 없으면 null
      example: '1240000000'
    Rate:
      type:
      - string
      - 'null'
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      description: 비율(%). 기준값이 0이면 null(화면 표시 '산정 불가')
      example: '14.8'
    Timestamp:
      type: string
      format: date-time
      example: '2026-11-12T09:00:00Z'
    StateToken:
      type: string
      description: 리소스의 현재 상태 지문. 수정 명령의 `expectedStateToken`에 그대로 넣음
      example: st_3f9a1c
    Label:
      type: string
      description: 화면 표시용 버전 이름(`2026-11-01`, `ver10.01`, `2027-PLAN-01`, `master_ver10`)
      example: '2026-11-01'
    Scenario:
      type: string
      enum:
      - PLAN
      - ACTUAL
      - ESTIMATE
      description: 계획 / 실적 / 추정
    Comparison:
      type: string
      enum:
      - ACTUAL_VS_PLAN
      - ESTIMATE_VS_PREVIOUS
      - ESTIMATE_VS_PLAN
      description: 실적 vs 계획 / 추정 vs 직전 추정 / 추정 vs 계획 (FR-MONTH-005)
    RequestType:
      type: string
      enum:
      - ANNUAL_PLAN
      - MONTHLY_ACTUAL
      description: 연간 계획 요청 / 월간 시트(실적·추정) 요청
    SubmissionStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - REJECTED
      - APPROVED
      description: 업로드만 함 / 검토 대기 / 재제출 요청됨 / 승인
    WorkflowTab:
      type: string
      enum:
      - NEEDS_REVIEW
      - SELECTED
      - IN_PROGRESS
      - RE_REVIEW
      - ACCEPTED
      - EXCLUDED
      - ALL
      description: Gap 상태 탭 (FR-MONTH-006). IN_PROGRESS·RE_REVIEW·ACCEPTED는 소명 회차로 계산
    DataStatus:
      type: string
      enum:
      - CONFIRMED
      - PROVISIONAL
      - NONE
      description: master 있음 / master 없이 승인본만으로 계산한 잠정 / 데이터 없음
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - requestId
      - errors
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          description: 화면에 보여 줄 수 있는 한국어 설명
        instance:
          type: string
          description: 오류가 난 요청 경로(쿼리 제외)
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: 프론트 분기용 오류 코드
        requestId:
          type: string
        errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
          example: dueAt
        code:
          type: string
          example: INVALID_VALUE
    PageInfo:
      type: object
      required:
      - nextCursor
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: 마지막 페이지면 null
    StateTokenInput:
      type: object
      required:
      - expectedStateToken
      properties:
        expectedStateToken:
          $ref: '#/components/schemas/StateToken'
    OrganizationRef:
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          example: D100
        name:
          type: string
          example: 네트워크인프라부문
    UserRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 최인프 매니저
    Organization:
      allOf:
      - $ref: '#/components/schemas/OrganizationRef'
      - type: object
        properties:
          managers:
            type: array
            description: 수신 담당자(조직 담당자 계정)
            items:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                name:
                  type: string
                email:
                  type: string
                  format: email
    Me:
      type: object
      required:
      - user
      - role
      - menus
      properties:
        user:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
              example: 김기획 매니저
            email:
              type: string
              format: email
        role:
          type: string
          enum:
          - PLANNER
          - ORG_MANAGER
        organization:
          description: 조직 담당자만. 경영기획팀은 null
          oneOf:
          - $ref: '#/components/schemas/OrganizationRef'
          - type: 'null'
        homePath:
          type: string
          example: /planning
        menus:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: NOTIFICATIONS
              label:
                type: string
                example: 알림 모아보기
              path:
                type: string
    Link:
      type: object
      description: 이동할 화면과 미리 선택할 대상
      properties:
        path:
          type: string
          example: /planning/gap
        query:
          type: object
          additionalProperties:
            type: string
          example:
            requestId: '31'
            organizationId: '4'
            reviewItemId: '880'
    Notification:
      type: object
      required:
      - id
      - type
      - title
      - organization
      - occurredAt
      - read
      - link
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum:
          - SUBMISSION
          - REPLY
          - OVERDUE
        title:
          type: string
          example: 10월 매출 Gap 소명 회신 도착
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        actor:
          description: 회신자(기한 경과는 null)
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        read:
          type: boolean
        link:
          $ref: '#/components/schemas/Link'
    SubmissionRequest:
      type: object
      required:
      - id
      - type
      - year
      - status
      - dueAt
      - requestedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/RequestType'
        year:
          type: integer
          example: 2026
        month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 12
          description: 연간 요청은 null
        title:
          type: string
          example: 2026년 10월 월간 시트
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        message:
          type: string
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        requestedBy:
          $ref: '#/components/schemas/UserRef'
        submittedCount:
          type: integer
        targetCount:
          type: integer
        stateToken:
          $ref: '#/components/schemas/StateToken'
    RequestTarget:
      type: object
      required:
      - organization
      - displayStatus
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        selected:
          type: boolean
          description: 실제로 요청을 보낸 조직인지(false면 필수 대상이지만 아직 요청 안 함)
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        displayStatus:
          type: string
          enum:
          - SUBMITTED
          - OVERDUE
          - WAITING
          description: 제출 완료 / 기한 경과 / 회신 대기 (FR-YEAR-002, FR-MONTH-002). 최신 제출본 상태와 기한으로 계산
        latestSubmission:
          oneOf:
          - $ref: '#/components/schemas/SubmissionSummary'
          - type: 'null'
    SubmissionSummary:
      type: object
      required:
      - id
      - status
      - label
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        displayStatus:
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - RESUBMIT_REQUESTED
          - SUPERSEDED
          description: 화면 상태. 반려됐고 새 제출본이 없으면 RESUBMIT_REQUESTED(재제출 요청), 새 제출본으로 대체됐으면 SUPERSEDED(반려된 제출본)
        label:
          $ref: '#/components/schemas/Label'
        approvedLabel:
          type:
          - string
          - 'null'
          description: 승인 버전(`ver10.01`). APPROVED일 때만
        requestId:
          $ref: '#/components/schemas/Id'
        requestTitle:
          type: string
        period:
          type: string
          example: '2026.11'
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        stateToken:
          $ref: '#/components/schemas/StateToken'
    FileRef:
      type: object
      properties:
        name:
          type: string
          example: D100_2026-11.xlsx
        url:
          type: string
          description: 다운로드 API 경로
    Submission:
      allOf:
      - $ref: '#/components/schemas/SubmissionSummary'
      - type: object
        properties:
          kind:
            $ref: '#/components/schemas/RequestType'
          title:
            type: string
            example: 2026년 11월 월간 실적·추정 제출
          organization:
            $ref: '#/components/schemas/OrganizationRef'
          file:
            $ref: '#/components/schemas/FileRef'
          replyMessage:
            type:
            - string
            - 'null'
            description: 조직 담당자 회신 메시지
          reviewComment:
            type:
            - string
            - 'null'
            description: 경영기획팀 코멘트(재제출 요청 시 필수)
          submittedBy:
            $ref: '#/components/schemas/UserRef'
          reviewedBy:
            oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          reviewedAt:
            type:
            - string
            - 'null'
            format: date-time
          parsingJob:
            $ref: '#/components/schemas/ParsingJob'
          validation:
            type: object
            properties:
              canSubmit:
                type: boolean
              errorCount:
                type: integer
          baseline:
            $ref: '#/components/schemas/Baseline'
          previousSubmission:
            oneOf:
            - $ref: '#/components/schemas/SubmissionSummary'
            - type: 'null'
          nextSubmission:
            oneOf:
            - $ref: '#/components/schemas/SubmissionSummary'
            - type: 'null'
    ParsingJob:
      type: object
      properties:
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        attemptNo:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    Baseline:
      type: object
      description: 소명 비교 기준 버전
      properties:
        kind:
          type: string
          enum:
          - PREV_MONTH_APPROVED
          - REJECTED
          - NONE
          description: 전월 승인 제출본 / 반려된 제출본(재제출) / 비교 기준 없음(연간 계획)
        submissionId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        label:
          type:
          - string
          - 'null'
          example: '2026-10-02'
    Diagnostic:
      type: object
      properties:
        sourceCell:
          type: string
          example: 손익제출!N40
        item:
          type: string
          example: 설비 임차료
        rule:
          type: string
          example: 금액 누락
        guide:
          type: string
          example: 필수 셀에 금액을 입력해 주세요.
    GapThreshold:
      type: object
      required:
      - comparison
      - percentEnabled
      - amountEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        comparison:
          $ref: '#/components/schemas/Comparison'
        percentEnabled:
          type: boolean
        percent:
          type: string
          example: '5'
        amountEnabled:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'
        appliedAt:
          $ref: '#/components/schemas/Timestamp'
        appliedBy:
          $ref: '#/components/schemas/UserRef'
    GapThresholdInput:
      type: object
      required:
      - comparison
      - percentEnabled
      - percent
      - amountEnabled
      - amount
      description: 두 기준 중 하나 이상 켜야 함(둘 다 켜면 모두 충족하는 항목만 Gap)
      properties:
        comparison:
          $ref: '#/components/schemas/Comparison'
        percentEnabled:
          type: boolean
        percent:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '5'
        amountEnabled:
          type: boolean
        amount:
          type: string
          pattern: ^[0-9]+$
          description: 원 단위
          example: '50000000'
    ReviewTreeNode:
      type: object
      description: 대/중/소/상세 계층형 표의 한 행
      properties:
        reportItemId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 고객모집비용
        level:
          type: integer
          minimum: 1
          maximum: 4
        plan:
          $ref: '#/components/schemas/Money'
        actual:
          $ref: '#/components/schemas/Money'
        diff:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'
        stage:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 5
          description: 진행 단계 1 차이 항목 확인 ~ 5 승인 및 확정
        tab:
          $ref: '#/components/schemas/WorkflowTab'
        reviewItemId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        stateToken:
          $ref: '#/components/schemas/StateToken'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTreeNode'
    OrgReviewItem:
      type: object
      description: 조직 담당자 화면의 소명 대상 셀(Gap 기준은 내려주지 않음)
      properties:
        reviewItemId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 네트워크 서비스 매출
        sourceCell:
          type: string
          example: 손익제출!M18
        baseline:
          $ref: '#/components/schemas/Money'
        previous:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 재제출일 때 직전 제출값(누락이면 null → '비교 불가')
        current:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'
        answerState:
          type: string
          enum:
          - EMPTY
          - WRITTEN
          - INHERITED
        stateToken:
          $ref: '#/components/schemas/StateToken'
    Explanation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        round:
          type: integer
          minimum: 1
        requestNote:
          type:
          - string
          - 'null'
          description: 경영기획팀 요청 메모(첫 회차는 null)
        requestedBy:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        requestedAt:
          type:
          - string
          - 'null'
          format: date-time
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
        answer:
          type:
          - string
          - 'null'
        answeredBy:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        answeredAt:
          type:
          - string
          - 'null'
          format: date-time
        verdict:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          description: 판단 전 / 수락 / 재요청
        reviewNote:
          type:
          - string
          - 'null'
        approvedLabel:
          type:
          - string
          - 'null'
          description: 수락으로 확정된 버전(`v1.01`)
        inheritedFrom:
          description: 값이 그대로라 이어받은 지난 승인 소명
          oneOf:
          - type: object
            properties:
              explanationId:
                $ref: '#/components/schemas/Id'
              label:
                type: string
          - type: 'null'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 제휴계약_변경합의서.pdf
        size:
          type: integer
        contentType:
          type: string
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
    Master:
      type: object
      properties:
        id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: 생성 대기(WAITING)면 null
        year:
          type: integer
        month:
          type: integer
        seq:
          type: integer
        label:
          type: string
          example: master_ver10
        state:
          type: string
          enum:
          - WAITING
          - CONFIRMED
          description: 생성 대기 / 확정
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
    TemplateDefinition:
      type: object
      description: 블록 구성·기간 규칙·확정 SQL·서식 (FR-RPT-002, 006, 008)
      required:
      - blocks
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ReportBlock'
    ReportBlock:
      type: object
      required:
      - id
      - kind
      - title
      - order
      properties:
        id:
          type: string
          example: b1
        kind:
          type: string
          enum:
          - TABLE
          - LIST
          - TEXT
          - GAP
          - CHART
        title:
          type: string
          example: 실적 표
        order:
          type: integer
        period:
          type: object
          description: 공통 따라감 / 기준 월 ± n / 고정 월
          properties:
            rule:
              type: string
              enum:
              - FOLLOW
              - OFFSET
              - FIXED
            offset:
              type: integer
              example: 1
            fixedYear:
              type: integer
            fixedMonth:
              type: integer
            rangeMonths:
              type: integer
              description: 월별 추이 등 최근 n개월
        scope:
          type: string
          enum:
          - COMPANY
          - ORGANIZATION
        organizationId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        comparison:
          type: string
          enum:
          - NONE
          - PLAN
          - PREV_ESTIMATE
          - PREV_YEAR
        metricId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        sql:
          type:
          - string
          - 'null'
          description: 자연어 질의로 확정해 저장한 SQL
        emptyPolicy:
          type: string
          enum:
          - SHOW_NO_DATA
          - REMOVE
          - KEEP_ORIGINAL
        style:
          type: object
          properties:
            fontFamily:
              type: string
            fontSize:
              type: integer
            width:
              type: integer
            height:
              type: integer
    Template:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 월 마감 실적 보고(연결)
        latestVersion:
          type: integer
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/TemplateDefinition'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Metric:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          example: OP_BY_ORG
        name:
          type: string
          example: 조직별 영업이익
        description:
          type: string
    PdfJob:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        maskNumbers:
          type: boolean
        blocks:
          type: array
          description: SUCCEEDED일 때 추출한 블록(구성 확인용)
          items:
            allOf:
            - $ref: '#/components/schemas/ReportBlock'
            - type: object
              properties:
                needsCheck:
                  type: boolean
                  description: 종류·데이터 연결 확인 필요(노란색)
                sourceArea:
                  type: object
                  properties:
                    page:
                      type: integer
                    x:
                      type: number
                    y:
                      type: number
                    w:
                      type: number
                    h:
                      type: number
        pages:
          type: array
          items:
            type: object
            properties:
              false:
                type: integer
              maskedImageUrl:
                type: string
        errorCode:
          type:
          - string
          - 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TableData:
      type: object
      properties:
        dataStatus:
          $ref: '#/components/schemas/DataStatus'
        columns:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              type:
                type: string
                enum:
                - TEXT
                - MONEY
                - RATE
                - INTEGER
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
paths:
  /auth/codes:
    post:
      operationId: requestAuthCode
      tags:
      - 로그인·사용자
      summary: AUTH-01 인증 메일 요청·재전송
      description: 등록된 사내 도메인·계정에만 6자리 인증코드를 보냄. 코드 유효시간 3분, 재전송은 1분 후 가능. 로그인 전이라 사용자를 알 수 없어 Idempotency-Key를 받지 않는다(재전송 대기 1분으로 중복 발송을 막음).
      x-fr:
      - FR-AUTH-001
      - FR-AUTH-002
      x-tables:
      - app_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
            example:
              email: kim.plan@sk.com
      responses:
        '202':
          description: 인증 메일 발송
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  expiresAt:
                    $ref: '#/components/schemas/Timestamp'
                  resendAvailableAt:
                    $ref: '#/components/schemas/Timestamp'
              example:
                email: kim.plan@sk.com
                expiresAt: '2026-11-12T09:03:00Z'
                resendAvailableAt: '2026-11-12T09:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: '`UNREGISTERED_EMAIL` 등록되지 않은 계정·도메인 → ''등록되지 않은 계정입니다. 메일 주소를 확인해주세요'''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: '`CODE_RESEND_WAIT` 재전송 대기 시간(1분) 전'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/sessions:
    post:
      operationId: createSession
      tags:
      - 로그인·사용자
      summary: AUTH-02 인증코드로 로그인
      description: 성공하면 역할에 따라 홈 경로를 함께 돌려줌(경영기획팀 → 전사 손익 현황, 조직 담당자 → 요청함). 로그인 전이라 Idempotency-Key를 받지 않는다(코드는 한 번만 쓸 수 있음). 토큰 유효시간 기본 12시간.
      x-fr:
      - FR-AUTH-002
      - FR-AUTH-003
      - FR-AUTH-004
      x-tables:
      - app_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^[0-9]{6}$
            example:
              email: kim.plan@sk.com
              code: '482913'
      responses:
        '201':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - expiresAt
                - me
                properties:
                  token:
                    type: string
                  expiresAt:
                    $ref: '#/components/schemas/Timestamp'
                  me:
                    $ref: '#/components/schemas/Me'
        '400':
          description: '`INVALID_AUTH_CODE` 코드 불일치(''인증 코드가 일치하지 않습니다'') 또는 만료(''유효시간이 경과되어, 코드 재전송을 요청해주세요''). 이유는 `errors[0].code`=MISMATCH·EXPIRED·TOO_MANY_ATTEMPTS(5번 틀리면 재전송 필요)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/session:
    delete:
      operationId: deleteSession
      tags:
      - 로그인·사용자
      summary: AUTH-03 로그아웃
      x-fr:
      - FR-AUTH-007
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getMe
      tags:
      - 로그인·사용자
      summary: AUTH-04 로그인 사용자·역할·메뉴
      description: 조직 담당자는 소속 조직이 고정되어 내려감(FR-MENU-002).
      x-fr:
      - FR-AUTH-004
      - FR-MENU-001
      - FR-MENU-002
      x-tables:
      - app_user
      - organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                user:
                  id: '3'
                  name: 최인프 매니저
                  email: choi.infra@sk.com
                role: ORG_MANAGER
                organization:
                  id: '4'
                  code: D100
                  name: 네트워크인프라부문
                homePath: /requests
                menus:
                - key: INBOX
                  label: 요청함
                  path: /requests
                - key: HISTORY
                  label: 제출 이력 관리
                  path: /history
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/badges:
    get:
      operationId: getMenuBadges
      tags:
      - 로그인·사용자
      summary: AUTH-05 메뉴 배지 건수
      description: 0이면 프론트에서 배지를 숨김.
      x-fr:
      - FR-MENU-004
      x-tables:
      - notification
      - review_item
      - submission
      - request_target
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadNotifications:
                    type: integer
                    description: 경영기획팀
                  monthlyReviewNeeded:
                    type: integer
                    description: 경영기획팀
                  annualReviewNeeded:
                    type: integer
                    description: 경영기획팀
                  openRequests:
                    type: integer
                    description: 조직 담당자
              example:
                unreadNotifications: 8
                monthlyReviewNeeded: 27
                annualReviewNeeded: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications:
    get:
      operationId: listNotifications
      tags:
      - 알림 모아보기
      summary: NOTI-01 알림 목록(날짜 묶음) + 요약 지표
      x-fr:
      - FR-NOTI-A-001
      - FR-NOTI-A-002
      - FR-NOTI-A-003
      - FR-NOTI-A-005
      x-tables:
      - notification
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - ALL
          - SUBMISSION
          - REPLY
          - OVERDUE
          default: ALL
      - name: unreadOnly
        in: query
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - LATEST
          default: LATEST
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageInfo'
                - type: object
                  properties:
                    summary:
                      type: object
                      properties:
                        unreadCount:
                          type: integer
                        replyPendingCount:
                          type: integer
                          description: 회신 검토 대기
                        overdueOrganizationCount:
                          type: integer
                    typeCounts:
                      type: object
                      properties:
                        ALL:
                          type: integer
                        SUBMISSION:
                          type: integer
                        REPLY:
                          type: integer
                        OVERDUE:
