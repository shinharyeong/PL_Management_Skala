            properties:
              canSubmit:
                type: boolean
              errorCount:
                type: integer
          baseline:
            $ref: '#/components/schemas/Baseline'
          previousSubmission:
            oneOf:
            - $ref: '#/components/schemas/SubmissionSummary'
            - type: 'null'
          nextSubmission:
            oneOf:
            - $ref: '#/components/schemas/SubmissionSummary'
            - type: 'null'
    ParsingJob:
      type: object
