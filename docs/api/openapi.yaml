          type: string
          example: 손익제출!N40
        item:
          type: string
          example: 설비 임차료
        rule:
          type: string
          example: 금액 누락
        guide:
          type: string
          example: 필수 셀에 금액을 입력해 주세요.
    GapThreshold:
