      description: '엑셀 파일을 multipart로 받아 파일 이름·확장자(.xlsx, 요청당 1개)·조직(코드)을 먼저 확인하고, 통과하면 S3 `drafts/excel/`에 저장한 뒤 DRAFT를 만들고 파싱 작업을 큐(`parse.jobs`)에 넣는다.

        응답의 `kind`로 화면 제목(연간 계획 제출 / 월간 시트 제출)을 정한다(FR-UPLOAD-001). ''파일 다시 선택''도 이 API로 새 DRAFT를 만든다.

