      properties:
        reviewItemId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 네트워크 서비스 매출
        sourceCell:
          type: string
          example: 손익제출!M18
        baseline:
          $ref: '#/components/schemas/Money'
        previous:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 재제출일 때 직전 제출값(누락이면 null → '비교 불가')
        current:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'
        answerState:
          type: string
          enum:
          - EMPTY
          - WRITTEN
          - INHERITED
        stateToken:
          $ref: '#/components/schemas/StateToken'
    Explanation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        round:
          type: integer
          minimum: 1
        requestNote:
          type:
          - string
          - 'null'
          description: 경영기획팀 요청 메모(첫 회차는 null)
        requestedBy:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        requestedAt:
          type:
          - string
          - 'null'
          format: date-time
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
        answer:
          type:
          - string
          - 'null'
        answeredBy:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        answeredAt:
          type:
          - string
          - 'null'
          format: date-time
        verdict:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          description: 판단 전 / 수락 / 재요청
        reviewNote:
          type:
          - string
          - 'null'
        approvedLabel:
          type:
          - string
          - 'null'
          description: 수락으로 확정된 버전(`v1.01`)
        inheritedFrom:
          description: 값이 그대로라 이어받은 지난 승인 소명
          oneOf:
          - type: object
            properties:
              explanationId:
                $ref: '#/components/schemas/Id'
              label:
                type: string
          - type: 'null'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 제휴계약_변경합의서.pdf
        size:
          type: integer
        contentType:
          type: string
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
    Master:
      type: object
      properties:
        id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: 생성 대기(WAITING)면 null
        year:
          type: integer
        month:
          type:
          - integer
          - 'null'
          description: 연간 계획 master(master_plan)면 null
        seq:
          type:
          - integer
          - 'null'
          description: 같은 월 안의 master 회차. 생성 대기면 null
        label:
          type: string
          description: 생성 대기면 처음 만들어질 이름
          example: master_ver10.01
        state:
          type: string
          enum:
          - WAITING
          - CONFIRMED
          description: 생성 대기 / 확정
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
    TemplateDefinition:
      type: object
      description: |-
        자료 틀(FR-RPT-002·006·008). 형식의 기준은 AI다. 백엔드는 저장 봉투만 검사하고(JSON 스키마
        `backend/src/main/resources/report/template-definition.schema.json`, AI `model.py StoredTemplate`에서 생성)
        블록 세부(기간·범위·비교·표 스펙·배치·서식 등)는 AI·화면 형식 그대로 보관한다. `id`·`name`은 서버 값으로 맞춘다.
      required:
      - schema_version
      - name
      - blocks
      additionalProperties: true
      properties:
        schema_version:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          maxLength: 120
        blocks:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReportBlock'
    ReportBlock:
      type: object
      description: 블록. id·kind만 정해져 있고 나머지 칸은 AI·화면 형식(예 text, metric, period, scope, compare, options, bbox)
      required:
      - id
      - kind
      additionalProperties: true
      properties:
        id:
          type: string
          maxLength: 64
          example: b1
        kind:
          type: string
          maxLength: 40
          description: AI가 정하는 종류(예 title, paragraph, table, list, chart, numbercard, footnote)
          example: table
        needs_review:
          type: array
          description: 확인 필요 사유 코드(구성 확인 단계 노란 표시)
          items:
            type: string
    Template:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: 월 마감 실적 보고(연결)
        latestVersion:
          type: integer
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/TemplateDefinition'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Metric:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          example: OP_BY_ORG
        name:
          type: string
          example: 조직별 영업이익
        description:
          type: string
    PdfJob:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        maskNumbers:
          type: boolean
        definition:
          oneOf:
          - $ref: '#/components/schemas/TemplateDefinition'
          - type: 'null'
          description: SUCCEEDED일 때 AI가 추출한 틀 초안(구성 확인용). 확인이 필요한 블록은 needs_review가 있다
        pages:
          type: array
          items:
            type: object
            properties:
              "no":
                type: integer
              maskedImageUrl:
                type: string
        errorCode:
          type:
          - string
          - 'null'
          description: FAILED일 때(예 PDF_UNREADABLE, INVALID_TEMPLATE, REPORT_AI_UNAVAILABLE)
        errorMessage:
          type:
          - string
          - 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        finishedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    TableData:
      type: object
      properties:
        dataStatus:
          $ref: '#/components/schemas/DataStatus'
        columns:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              type:
                type: string
                enum:
                - TEXT
                - MONEY
                - RATE
                - INTEGER
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
