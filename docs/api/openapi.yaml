                    - REFUSED
                    - UNAVAILABLE
                    description: 변경안 있음 / 되묻기 / 거절(숫자 변경 요청 등) / AI 사용 불가
                  message:
                    type:
                    - string
                    - 'null'
                  proposals:
                    type: array
                    items:
                      type: object
                      properties:
                        op:
                          type: string
                          description: AI 편집 조작(report-ai chat_edit). 숫자 값은 바꾸지 않는다
                          enum:
                          - add_block
                          - remove_block
                          - move_block
                          - set_style
                          - add_column
                        target:
                          type: string
                        description:
                          type: string
                          example: 실적 표 아래 '비용 상세' 블록 추가
                        patch:
                          type: object
                          additionalProperties: true
                  definitionPreview:
                    $ref: '#/components/schemas/TemplateDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: '`REPORT_AI_UNAVAILABLE` 또는 `PROCESSING_UNAVAILABLE`: AI 서비스 일시 불가'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: '`AI_DAILY_LIMIT` 하루 AI 호출 상한 초과'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /report/export:
    post:
      operationId: exportReport
      tags:
      - AI 보고서
      summary: RPT-16 자료 XLSX 내보내기(1개씩, 저장하지 않음)
      description: |-
        서버는 XLSX만 만든다. PNG·PDF는 화면에 보이는 그대로 브라우저에서 만든다(배치를 서버에서 다시 그리지 않음).
        화면에서 받은 숫자를 쓰지 않고, 저장된 틀(templateId·version)과 기준 월(period)로 report-ai에 다시 채워(RPT-10과 같은 경로)
        숫자를 원 단위 값 그대로 넣는다. 잠정 월이면 제목에 '(잠정)'. version을 비우면 최신, blockId를 주면 그 블록만.
      x-fr:
      - FR-RPT-008
      - FR-RPT-009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - templateId
              - period
              - format
              properties:
                templateId:
                  $ref: '#/components/schemas/Id'
                version:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  description: 비우면 최신 버전
                period:
                  type: object
                  required:
                  - year
                  - month
                  properties:
                    year:
                      type: integer
                    month:
                      type: integer
                blockId:
                  type:
                  - string
                  - 'null'
                  description: 블록 하나만 내보낼 때
                format:
                  type: string
                  enum:
                  - XLSX
                  description: PNG·PDF는 화면에서 만든다
      responses:
        '200':
          $ref: '#/components/responses/FileStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: '`REPORT_AI_UNAVAILABLE` 숫자를 다시 채울 보고서 AI에 연결할 수 없음'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /submission-template/file:
    get:
      operationId: downloadRequestTemplate
      tags:
      - 업로드·검증
      summary: UP-01 제출 양식 다운로드(연간·월간 공통)
      x-fr:
      - FR-UPLOAD-002
      x-tables: []
      responses:
        '200':
          $ref: '#/components/responses/FileStream'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`TEMPLATE_NOT_FOUND` 서버에 양식 파일이 없음'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: 연간 계획과 월간 시트가 같은 양식이라 파일 하나를 내려준다. 로그인한 사용자 누구나 받을 수 있다. 파일이 준비되지 않았으면 404.
