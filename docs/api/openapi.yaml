  /submission-requests/{requestId}/submissions:
    post:
      operationId: createSubmissionDraft
      tags:
      - 업로드·검증
      summary: UP-03 제출 초안 생성 + 파일 규칙 확인 + 파싱 작업 등록
      description: '엑셀 파일을 multipart로 받아 파일 이름·확장자(.xlsx·.xlsb, 요청당 1개)·조직(코드)을 먼저 확인하고, 통과하면 로컬/PVC 초안 위치에 저장한 뒤 DRAFT와 parsing_job을 만들고 프로세스 내 실행기로 파서를 호출한다. RabbitMQ `parse.jobs`는 2차 목표이다.

        응답의 `kind`로 화면 제목(연간 계획 제출 / 월간 시트 제출)을 정한다(FR-UPLOAD-001). ''파일 다시 선택''도 이 API로 새 DRAFT를 만든다.

        초안 7일 자동 삭제는 2차 목표이며 현재 구현은 자동 삭제하지 않는다.'
      x-fr:
      - FR-UPLOAD-001
      - FR-UPLOAD-003
      - FR-UPLOAD-004
      - FR-UPLOAD-005
      - FR-RESUB-001
      x-tables:
      - submission
      - stored_object
      - parsing_job
      parameters:
      - $ref: '#/components/parameters/RequestIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: .xlsx 또는 .xlsb 파일(실제 배포 양식은 .xlsb)
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '202':
          description: 초안 생성, 파싱 대기
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_CLOSED` 마감된 요청, `REQUEST_TARGET_EXCLUDED` 대상이 아닌 조직, `PENDING_ALREADY_EXISTS` 이미 검토 대기 중인 제출본 있음 + 명령 공통 409'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`INVALID_FILENAME` 파일 이름·확장자 규칙 위반(''파일 이름과 확장자명을 다시 확인해주세요.''), `ORGANIZATION_MISMATCH` 다른 조직 파일(''조직명을 다시 확인해주세요.'', details.fileOrganizationCode)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: 조직명을 다시 확인해주세요.
                instance: /api/v1/submission-requests/31/submissions
                code: ORGANIZATION_MISMATCH
                requestId: 8f3c2a1e
                errors: []
        '503':
          description: '`PARSER_BUSY` 파싱 작업을 받을 수 없음(잠시 후 재시도)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFile'
