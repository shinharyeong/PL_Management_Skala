<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>보고서 자료 생성 </title><style>__CSS__</style></head><body>
<div class="app">__SIDEBAR__
<div class="main">
<div class="tabs"><a href="report" data-nav="report" class="on">보고서 자료 생성</a><a href="gap" data-nav="gap">Gap · 소명 검토</a></div>
<div class="crumb">경영기획팀 / 보고서</div>
<div class="titlebar"><h1>보고서 자료 생성</h1>
<div class="ctrls"><div class="sel"><span>기준월</span><b id="baseMonth"></b></div>
<div class="sel"><span>버전</span><select id="ver"></select></div><button class="btn" id="chatOpen" type="button">AI 작업실 열기</button><button class="btn gold" disabled title="준비 중">전체 다운로드 (준비 중)</button></div></div>
<div class="topbasis" id="topbasis"></div>
<div id="banner" class="banner"></div>
<div id="aibar" class="aibar"></div>
<div id="filters"></div>
<div class="layout"><div class="cards" id="cards"></div>
<aside class="panel"><h3>자료 구성</h3><h6>표</h6><div id="opt-table"></div><h6>차트</h6><div id="opt-chart"></div><h6>옵션</h6>
<div id="opt-opt"></div><div class="fixed"><div class="sel"><span>단위</span><b>억원</b></div><div class="sel"><span>범위</span><b>전사</b></div></div>
<button class="btn dark dl" disabled id="dl">선택 0개 자료 한 번에 다운로드</button><div class="hint">준비 중 · 지금은 모양만</div></aside></div>
</div></div>
<aside class="chat" id="chat" aria-label="AI 작업실">
  <div class="chat-top"><div class="ai-mark">✦</div><div><h2>AI 작업실</h2><p>한국어로 물으면 조회 → 엑셀 + 설명</p></div><button class="btn" id="chatNew" type="button" title="이어 쓰는 조건과 대화를 지웁니다">새 대화</button><button class="btn" id="chatClose" type="button" title="닫기">×</button></div>
  <div class="chat-ctx"><div class="dots"><span class="sdot" id="dotSrv" title="서버"></span><span>서버</span><span class="sdot" id="dotDb" title="DB"></span><span>DB</span><span class="sdot" id="dotAi" title="AI"></span><span>AI</span>
    <label class="srvlab">서버 주소 <input id="chatSrv" value=""></label></div><div id="chatStatus" class="d2"></div></div>
  <div class="chat-body"><div class="quick" id="chatQuick"></div><div class="chips" id="chatChips" style="display:none"></div><div id="chatConv"></div></div>
  <form class="chat-form" id="chatForm"><textarea id="chatText" rows="2" maxlength="500" placeholder='질문을 입력하세요 (Enter 전송)'></textarea><div class="chat-foot"><span class="d2">AI 는 SQL·문장만 쓰고 숫자는 DB 조회 결과입니다</span><button class="btn dark" id="chatSend" type="submit">보내기 ↑</button></div></form>
</aside>
<div class="tip" id="tip"></div>
<script>window.DATA=__DATA__;</script>
<script>
__COMMON_JS__
__FILTERS_JS__
__PAGE_JS__
__CHAT_JS__
</script></body></html>
