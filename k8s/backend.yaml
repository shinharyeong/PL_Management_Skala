# Spring Boot API. 엑셀 파서를 자식 프로세스로 실행한다(이미지에 parser/src 포함).
# 업로드 원본·제출 양식은 PVC backend-data(/data)에 둔다 — 볼륨이 한 파드에만 붙으므로 Recreate로 교체한다.
# PVC는 k8s/once/에 있다 — GitHub Actions 배포 Role은 PVC를 다룰 수 없어 개인 kubectl로 한 번만 만든다.
apiVersion: v1
kind: ConfigMap
metadata: { name: backend-config }
data:
  SPRING_PROFILES_ACTIVE: prod
  TZ: Asia/Seoul
  # 1차 배포: SMTP 없이 인증코드를 로그로 확인한다(Pod 로그에서 인증코드 확인).
  # 로그를 읽을 수 있는 사람(팀·반 계정)이 코드를 볼 수 있으므로, SMTP(SPRING_MAIL_*)를 app-secrets에 넣으면 "false"로 바꾼다.
  APP_AUTH_DEV_LOG_CODE: "true"
  # /dev 계정 선택 로그인(이메일 인증 없음)·공통 문구 편집. 이 클러스터는 개발·시연 서버라 켜 둔다.
  # 캠퍼스 IP 제한은 캠퍼스 전체가 함께 쓰는 IP라, 접근 키 APP_DEV_TOOLS_ACCESS_KEY(app-secrets)가 맞아야 계정 목록·로그인이 열린다.
  # 키가 없으면 켜져 있어도 아무도 못 들어온다. 키 넣기·전달은 docs/infrastructure.md 4절 「개발 도구」.
  APP_DEV_TOOLS_ENABLED: "true"
  # 실제 배포 양식은 .xlsb다. 파일은 PVC /data/templates/에 둔다.
  APP_SUBMISSION_TEMPLATE_FILENAME: 제출양식.xlsb
  SUBMISSION_TEMPLATE_LOCATION: file:/data/templates/submission-template.xlsb
  # 보고서 AI(명세 12절). 토큰 REPORT_AI_TOKEN은 app-secrets에 두고 ai와 같은 값을 쓴다.
  REPORT_AI_URL: http://ai:8000
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, labels: { app: backend } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: { type: Recreate }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      terminationGracePeriodSeconds: 40
      containers:
        - name: backend
          image: backend-image   # kustomization.yaml images가 ECR 주소·태그로 바꾼다
          # management(8081): actuator health·prometheus. prod 프로필에서 분리(application-prod.yml). Ingress에는 열지 않는다.
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 8081 }]
          envFrom:
            - secretRef: { name: rds-credentials }          # SPRING_DATASOURCE_URL, PG* (USERNAME·PASSWORD는 아래 env로)
            - configMapRef: { name: backend-config }
            - secretRef: { name: app-secrets, optional: true }  # SPRING_MAIL_* 등
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
            # rds-credentials에는 SPRING_DATASOURCE_URL만 있고 USERNAME·PASSWORD 키가 없다(PG*로 들어 있다).
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: rds-credentials, key: PGUSER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: rds-credentials, key: PGPASSWORD } }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { cpu: 1500m, memory: 2Gi }
          volumeMounts: [{ name: data, mountPath: /data }]
          startupProbe:
            httpGet: { path: /actuator/health, port: management }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backend-data }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 8081, targetPort: management }   # Prometheus 수집용(클러스터 안)
