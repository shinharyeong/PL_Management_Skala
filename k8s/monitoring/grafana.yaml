# 대시보드(Grafana). https://p1-2.skala-ai.com/grafana/ (Ingress 경로, 캠퍼스 IP만 허용)
# 데이터 소스·대시보드는 Git의 파일로 만든다(grafana-provisioning, grafana-dashboards ConfigMap). 화면에서 고친 내용은 파드가 바뀌면 사라진다.
# 관리자 계정 Secret grafana-admin은 개인 kubectl로 한 번만 만든다(docs/infrastructure.md). Git에 넣지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, labels: { app: grafana } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.6.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-user } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } }
            # Ingress의 /grafana 경로 아래에서 동작
            - { name: GF_SERVER_ROOT_URL, value: "https://p1-2.skala-ai.com/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: TZ, value: Asia/Seoul }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /grafana/api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /grafana/api/health, port: http }
            periodSeconds: 30
            initialDelaySeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        # 사용자·세션 정보(sqlite). 계정은 Secret, 대시보드는 ConfigMap에서 다시 만들어지므로 파드 교체 시 비워도 된다.
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items: [{ key: datasources.yaml, path: datasources.yaml }]
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
