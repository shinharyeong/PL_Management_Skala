# 최신 skala-pg 접속 설정에서만 명시적으로 실행하는 개발용 중계 Pod이다.
# 일반 배포에 포함되지 않도록 kustomization.yaml의 resources에는 추가하지 않는다.
# DB 인증과 sslmode=require, 읽기 전용 설정은 연결하는 클라이언트가 적용한다.
apiVersion: v1
kind: Pod
metadata:
  name: pnl-agent-rds-tunnel
  namespace: p1-2
  labels:
    app.kubernetes.io/name: pnl-agent-rds-tunnel
    app.kubernetes.io/component: development-tunnel
spec:
  serviceAccountName: default
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tunnel
      image: alpine/socat:latest
      imagePullPolicy: Always
      command:
        - /bin/sh
        - -ec
      args:
        - |
          : "${PGHOST:?PGHOST is required}"
          exec socat TCP-LISTEN:5432,bind=127.0.0.1,fork,reuseaddr "TCP:${PGHOST}:5432"
      env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: PGHOST
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
