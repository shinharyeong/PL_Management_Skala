# 보고서 AI(FastAPI). 클러스터 안에서만 부른다(http://ai:8000) — Ingress로 밖에 열지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai, labels: { app: ai } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: ai } }
  template:
    metadata: { labels: { app: ai } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: ai
          image: ai-image   # kustomization.yaml images가 ECR 주소·태그로 바꾼다
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - secretRef: { name: app-secrets, optional: true }  # OPENAI_API_KEY, REPORT_AI_TOKEN
          env:
            - { name: TZ, value: Asia/Seoul }
            # PDF 분석 결과 보고(POST /internal/pdf-jobs/{id}/result). Ingress에는 /api만 열려 있어 밖에서 닿지 않는다.
            - { name: AI_BACKEND_URL, value: "http://backend:8080" }
            # 운영: REPORT_AI_TOKEN(app-secrets)이 없으면 계약 API를 거부하고 결과 보고도 하지 않는다
            - { name: AI_REQUIRE_INTERNAL_TOKEN, value: "true" }
            # 챗봇·값 채우기 조회 DB(#64). 팀 DB의 ai 스키마를 쓴다(AI_DB_SCHEMA 기본 ai).
            - name: AI_DATABASE_URL
              valueFrom: { secretKeyRef: { name: rds-credentials, key: DATABASE_URL } }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: ai }
spec:
  selector: { app: ai }
  ports: [{ name: http, port: 8000, targetPort: http }]
