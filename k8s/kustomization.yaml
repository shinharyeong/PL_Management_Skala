# 배포: main에 push되면 .github/workflows/deploy.yml이 캠퍼스 self-hosted runner에서 이미지를 ECR에 올리고 kubectl apply -k로 적용한다.
# 플랫폼이 만들어 둔 것: Secret rds-credentials·team-tls (ConfigMap s3-config, ServiceAccount s3-access는 아직 안 씀)
# 개인 kubectl로 한 번만 만드는 것: Secret app-secrets(Git에 넣지 않음), k8s/once/(PVC·NetworkPolicy — Actions Role 권한 밖)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: p1-2
labels:
  - pairs: { app.kubernetes.io/part-of: pl-management }
resources:
  - backend.yaml
  - ai.yaml
  - frontend.yaml
  - ingress.yaml
images:
  # ECR 저장소는 teams/p1-2/app 하나이고 태그는 <서비스>-<커밋 해시>다(덮어쓰기 불가).
  # 자리표시 태그 main은 배포할 때 deploy.yml이 임시 복사본에서 그 커밋 해시로 바꾼다(이 파일은 바뀌지 않는다).
  - { name: backend-image, newName: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/teams/p1-2/app, newTag: backend-main }
  - { name: ai-image, newName: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/teams/p1-2/app, newTag: ai-main }
  - { name: frontend-image, newName: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/teams/p1-2/app, newTag: frontend-main }
