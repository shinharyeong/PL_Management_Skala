# 체험 계정·조직 시드. 평소 배포(kustomization.yaml)에는 넣지 않고, deploy 워크플로를 seed=true로 수동 실행할 때만 적용한다.
# SQL은 같은 단계에서 ConfigMap seed-demo-sql로 만든다(backend/src/main/resources/db/local/R__local_seed.sql).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo
  namespace: p1-2
  labels: { app.kubernetes.io/part-of: pl-management }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600   # 팀 권한으로 Job을 지울 수 없어 쿠버네티스가 지우게 한다
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 70 }   # postgres:alpine의 postgres 사용자
      containers:
        - name: psql
          image: postgres:18-alpine
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]
          envFrom:
            - secretRef: { name: rds-credentials }   # PGHOST·PGPORT·PGDATABASE·PGUSER·PGPASSWORD
          env:
            - { name: PGSSLMODE, value: require }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts: [{ name: sql, mountPath: /seed, readOnly: true }]
      volumes:
        - name: sql
          configMap: { name: seed-demo-sql }
