# 팀 도메인 하나를 경로로 나눈다: /api → backend, /grafana → grafana, / → frontend. 캠퍼스 네트워크에서만 열린다(플랫폼 필수 주석).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "211.45.60.1/32,211.45.60.2/32,211.45.60.3/32,211.45.60.4/32,211.45.60.5/32"
    # backend는 보고서 AI 응답을 최대 90초 기다린다(app.report-ai.timeout-seconds). 기본 60초면 Ingress가 먼저 끊는다.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: public-nginx
  tls: [{ hosts: [p1-2.skala-ai.com], secretName: team-tls }]   # 플랫폼이 만들어 둔 인증서(Let's Encrypt, 자동 갱신)
  rules:
    - host: p1-2.skala-ai.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { name: http } } } }
          # 모니터링 대시보드(Grafana 로그인 필요). Prometheus는 열지 않는다.
          - { path: /grafana, pathType: Prefix, backend: { service: { name: grafana, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { name: http } } } }
